<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e76b1c" />

    <!-- Primary SEO: keyword-rich title + description (what Google shows) -->
    <title>TrimmTrack — Seguidor de cartera i calculadores d'inversió gratuïtes</title>
    <meta
      name="description"
      content="Segueix la teva cartera d'inversió en viu i fes servir calculadores gratuïtes: FIFO per a plusvàlues (IRPF), valoració d'empreses amb DCF i Reverse DCF, número de Graham i NAV. Sense registre."
    />
    <meta
      name="keywords"
      content="calculadora FIFO accions, calculadora FIFO acciones, càlcul plusvàlues IRPF, valoració empreses DCF, calculadora DCF gratis, descuento flujos de caja, reverse DCF, implied growth rate, número de Graham, Graham Number, seguidor de cartera, portfolio tracker, valoració d'accions, dividends"
    />
    <!-- No hardcoded canonical: this file is also the SPA fallback shell served
         for every non-prerendered route, so a fixed href here would tell Google
         those pages are the homepage. useSeo() emits a self-referencing
         canonical per route (derived from the URL) for both the prerendered
         snapshots and the client-rendered fallback. -->

    <!-- Open Graph / Twitter: professional link previews when shared -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrimmTrack" />
    <meta property="og:locale" content="ca_ES" />
    <meta property="og:url" content="https://www.trimmtrack.com/" />
    <meta
      property="og:title"
      content="TrimmTrack — Seguidor de cartera i calculadores d'inversió gratuïtes"
    />
    <meta
      property="og:description"
      content="Calculadora FIFO per a plusvàlues, valoració DCF / Reverse DCF, número de Graham i NAV. Segueix la teva cartera en viu, gratis i sense registre."
    />
    <meta property="og:image" content="https://www.trimmtrack.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TrimmTrack — Seguidor de cartera i calculadores gratuïtes"
    />
    <meta
      name="twitter:description"
      content="Calculadora FIFO, valoració DCF / Reverse DCF, número de Graham i NAV. Gratis i sense registre."
    />
    <meta name="twitter:image" content="https://www.trimmtrack.com/og.png" />

    <!-- Structured data: tells Google what the site/app is (rich results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.trimmtrack.com/#website",
            "url": "https://www.trimmtrack.com/",
            "name": "TrimmTrack",
            "inLanguage": "ca",
            "publisher": { "@id": "https://www.trimmtrack.com/#org" }
          },
          {
            "@type": "Organization",
            "@id": "https://www.trimmtrack.com/#org",
            "name": "TrimmTrack",
            "url": "https://www.trimmtrack.com/",
            "logo": "https://www.trimmtrack.com/favicon.svg"
          },
          {
            "@type": "WebApplication",
            "name": "TrimmTrack",
            "url": "https://www.trimmtrack.com/",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "inLanguage": ["ca", "es", "en"],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "description": "Seguidor de cartera d'inversió amb calculadora FIFO per a plusvàlues, valoració DCF i Reverse DCF, número de Graham, Monte Carlo i NAV (suma de parts). Portfolio tracker con calculadoras de valoración, simulación y predicción de carteras de ETFs, y análisis de empresas (Netflix, EXOR).",
            "featureList": [
              "Portfolio tracker: sube tu Excel y visualiza P&L, dividendos y pesos en vivo",
              "Stock valuation calculators: DCF, Reverse DCF, Graham number, Monte Carlo, sum-of-the-parts (NAV)",
              "ETF portfolio forecast & simulation (Monte Carlo, contributions, fees)",
              "Equity research: Netflix, EXOR valuation models",
              "FIFO capital-gains calculator",
              "Portfolio analytics: beta, alpha, Sharpe, drawdown"
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#f7f1e7] text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
