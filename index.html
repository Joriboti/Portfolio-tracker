<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e76b1c" />

    <!-- Primary SEO: keyword-rich title + description (what Google shows) -->
    <title>TrimmTrack — Portfolio tracker, DCF calculators &amp; ETF forecasting</title>
    <meta
      name="description"
      content="Track your investment portfolio live and use free calculators: FIFO capital gains, DCF and Reverse DCF valuation, Graham number, Monte Carlo and NAV. No sign-up."
    />
    <meta
      name="keywords"
      content="calculadora FIFO accions, calculadora FIFO acciones, càlcul plusvàlues IRPF, valoració empreses DCF, calculadora DCF gratis, descuento flujos de caja, reverse DCF, implied growth rate, número de Graham, Graham Number, seguidor de cartera, portfolio tracker, valoració d'accions, dividends"
    />
    <!-- No hardcoded canonical: this file is also the SPA fallback shell served
         for every non-prerendered route, so a fixed href here would tell Google
         those pages are the homepage. useSeo() emits a self-referencing
         canonical per route (derived from the URL) for both the prerendered
         snapshots and the client-rendered fallback. -->

    <!-- Open Graph / Twitter: professional link previews when shared -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrimmTrack" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.trimmtrack.com/" />
    <meta
      property="og:title"
      content="TrimmTrack — Portfolio tracker, DCF calculators &amp; ETF forecasting"
    />
    <meta
      property="og:description"
      content="FIFO capital-gains calculator, DCF / Reverse DCF valuation, Graham number and NAV. Track your portfolio live, free and without sign-up."
    />
    <meta property="og:image" content="https://www.trimmtrack.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TrimmTrack — Portfolio tracker and free investing calculators"
    />
    <meta
      name="twitter:description"
      content="FIFO calculator, DCF / Reverse DCF valuation, Graham number and NAV. Free, no sign-up."
    />
    <meta name="twitter:image" content="https://www.trimmtrack.com/og.png" />

    <!-- Structured data: tells Google what the site/app is (rich results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.trimmtrack.com/#website",
            "url": "https://www.trimmtrack.com/",
            "name": "TrimmTrack",
            "alternateName": ["Trimm Track", "trimmtrack.com"],
            "inLanguage": ["ca", "es", "en"],
            "publisher": { "@id": "https://www.trimmtrack.com/#org" }
          },
          {
            "@type": "Organization",
            "@id": "https://www.trimmtrack.com/#org",
            "name": "TrimmTrack",
            "alternateName": "Trimm Track",
            "url": "https://www.trimmtrack.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.trimmtrack.com/logo.png",
              "width": 512,
              "height": 512
            },
            "sameAs": ["https://x.com/trimmtrack"]
          },
          {
            "@type": "WebApplication",
            "name": "TrimmTrack",
            "url": "https://www.trimmtrack.com/",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "inLanguage": ["ca", "es", "en"],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "description": "Free portfolio tracker with a FIFO capital-gains calculator, DCF and Reverse DCF valuation, Graham number, Monte Carlo, sum-of-the-parts (NAV), ETF portfolio forecasting and equity research. In Catalan, Spanish and English.",
            "featureList": [
              "Portfolio tracker: upload your Excel or a Google Sheets link and see live P&L, dividends and weights",
              "Stock valuation calculators: DCF, Reverse DCF, Graham number, Monte Carlo, sum-of-the-parts (NAV)",
              "ETF portfolio forecast & simulation (Monte Carlo, contributions, fees)",
              "Equity research: Netflix, EXOR valuation models",
              "FIFO capital-gains calculator",
              "Portfolio analytics: beta, alpha, Sharpe, drawdown"
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Satoshi carries the headings. Fredoka's rounded terminals read as
         friendly, which is the wrong register for a page of other people's
         money; Satoshi is the same weight of voice without the softness. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#f7f1e7] text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
